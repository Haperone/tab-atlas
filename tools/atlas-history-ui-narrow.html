<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas history — 320 px layout checks</title>
<style>
  body { margin: 16px; font: 14px/1.5 system-ui, sans-serif; }
  iframe { display: block; width: 320px; height: 720px; border: 0; }
  pre { white-space: pre-wrap; }
</style>
<p>Disposable collection-history fixture in a 320 px iframe. This checks layout,
  not browser zoom or installed extension behavior.</p>
<iframe title="Tab Atlas at 320 px"></iframe>
<pre id="atlasNarrowResults" role="status">Running…</pre>
<script type="module">
  const frame = document.querySelector('iframe'), output = document.querySelector('pre');
  const requestedHeight = Number(new URLSearchParams(location.search).get('height') || 720);
  if (Number.isFinite(requestedHeight)) frame.style.height = `${Math.max(240, Math.min(720, requestedHeight))}px`;
  frame.src = 'screenshot-harness.html?time-machine&history-checks&theme=spaceblack';
  function read() {
    const result = frame.contentDocument?.querySelector('#atlasHistoryUIResults');
    if (result?.textContent) {
      const report = JSON.parse(result.textContent);
      if (!report.running) {
        report.layoutHarness = `320 × ${frame.clientHeight} px iframe; not browser zoom`;
        output.textContent = JSON.stringify(report, null, 2);
        return;
      }
    }
    requestAnimationFrame(read);
  }
  requestAnimationFrame(read);
</script>
</html>
